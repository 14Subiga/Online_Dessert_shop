<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="login.css">

</head>
<body>
<div class="form">
        <h2>Login</h2><br> 
        <div class="input">
            <input type="username" placeholder="USERNAME" class="user" id="user" /><br><br>
            <input type="password" placeholder="PASSWORD" class="pass" id="pass"/>
        <br><br>   
        
        </div>
        <div class="remember">
            <label><input type="checkbox"/> Remember me</label>
            <a href="#">Forget password?</a>
        </div>
        <div class="button">
            <br><button type="button" class="login-button" onclick="redirectToProduct()">Login</button>
        </div>
        <div class="sign-up">
            <br><p>Don't have an account?<a href="Register.html">Sign Up</a></p>
        </div>    
</div> 
<script>
    function redirectToProduct() {
        window.location.href = "product.html";
    }
</script>
</body>
<script type="module" src="./server.js"></script>
</html>
